<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<!-- Apply theme before first paint to prevent flash -->
<script>(function(){var t=localStorage.getItem('er-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();</script>
<script defer src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/scroll-animations.js' | relative_url }}"></script>

{% assign og_title = page.title | default: site.title %}
{% assign og_description = page.excerpt | default: page.description | default: site.description %}
{% assign og_image = page.og_image | default: site.og_image %}
{% assign og_url = page.url | absolute_url %}

<!-- Open Graph -->
<meta property="og:type"        content="website" />
<meta property="og:site_name"   content="{{ site.title }}" />
<meta property="og:title"       content="{{ og_title }}" />
<meta property="og:description" content="{{ og_description }}" />
<meta property="og:url"         content="{{ og_url }}" />
<meta property="og:image"       content="{{ og_image | absolute_url }}" />
<meta property="og:image:width"  content="612" />
<meta property="og:image:height" content="612" />

<!-- Twitter Card -->
<meta name="twitter:card"        content="summary" />
<meta name="twitter:title"       content="{{ og_title }}" />
<meta name="twitter:description" content="{{ og_description }}" />
<meta name="twitter:image"       content="{{ og_image | absolute_url }}" />
